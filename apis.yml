apis:
- name: WoowUp MCP Server
  description: Hosted, remote Model Context Protocol server operated by WoowUp at
    mcp.woowup.com. Streamable-HTTP transport, OAuth 2.1 bearer authentication with
    RFC 8414 authorization-server and RFC 9728 protected-resource metadata, dynamic
    client registration and PKCE S256. The protected-resource document advertises a
    campaigns:read scope alongside the standard OIDC scopes. tools/list and initialize
    return HTTP 401 without a token, so the live tool schemas require authenticated
    introspection and are not recorded; no tool list is guessed. Found by probing —
    WoowUp does not document this server.
  humanURL: https://mcp.woowup.com/.well-known/oauth-protected-resource
  baseURL: https://mcp.woowup.com/mcp
  tags:
  - MCP
  - Agents
  - OAuth
  properties:
  - type: MCPServer
    url: mcp/woowup-mcp.yml
  - type: OAuthScopes
    url: scopes/woowup-scopes.yml
  - type: Authentication
    url: authentication/woowup-authentication.yml
- name: WoowUp API v3
  description: REST API for syncing customers (multi-ID), purchases, products, categories,
    branches, coupons, benefits, points, user events, custom attributes, abandoned carts,
    blacklists, segment exports, and integration stats into the WoowUp customer marketing
    and loyalty platform. JSON-only requests and responses, API-key authentication, offset
    pagination, and weighted sliding-window rate limiting (default 140 requests/minute).
  humanURL: https://docs.woowup.com
  baseURL: https://api.woowup.com/apiv3
  tags:
  - Users
  - Purchases
  - Products
  - Loyalty
  - Coupons
  - Events
