aid: woowup
name: WoowUp
description: WoowUp is a customer marketing and loyalty CRM platform built for retail and
  ecommerce brands across Latin America. Founded in Buenos Aires and backed by 500 Global,
  WoowUp centralizes customer, purchase, and product data from POS and ecommerce platforms
  (VTEX, Magento, Shopify, WooCommerce, PrestaShop, Tienda Nube) and activates it through
  segmentation, campaigns, loyalty programs, web push notifications, and abandoned-cart
  recovery. Its REST API v3 lets developers sync users (multi-ID), purchases, products,
  coupons, benefits, points, and custom events, with client libraries published in PHP.
