apis:
- name: WoowUp API v3
  description: REST API for syncing customers (multi-ID), purchases, products, categories,
    branches, coupons, benefits, points, user events, custom attributes, abandoned carts,
    blacklists, segment exports, and integration stats into the WoowUp customer marketing
    and loyalty platform. JSON-only requests and responses, API-key authentication, offset
    pagination, and weighted sliding-window rate limiting (default 140 requests/minute).
