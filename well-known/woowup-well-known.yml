method: searched
description: >-
  Results of probing the /.well-known/ discovery surface for every WoowUp host
  (www.woowup.com, api.woowup.com, docs.woowup.com, app.woowup.com,
  mcp.woowup.com). Status is the HTTP code observed at fetch time. Two real
  documents are served, both on mcp.woowup.com, the OAuth-protected hosted MCP
  server: RFC 8414 authorization-server metadata and RFC 9728 protected-resource
  metadata. Every other host returns a 404, a redirect into the app.woowup.com
  login SPA, or a GitBook redirect — none serves a genuine document. Note that
  *.woowup.com is a DNS wildcard whose default backend answers with the
  app.woowup.com SPA, so an HTTP 200 from an arbitrary subdomain is not
  evidence of a document; mcp.woowup.com is distinguishable because it answers
  from a uvicorn server with real JSON and an RFC 6750 WWW-Authenticate
  challenge rather than the SPA shell.
