source: >-
  Asserted from the WoowUp developer docs (Getting Started, connection-security)
  and the live probes recorded in security/woowup-domain-security.yml. WoowUp
  publishes no OpenAPI, no compliance/trust-center page, and no certification
  claims were found on woowup.com.
standards:
