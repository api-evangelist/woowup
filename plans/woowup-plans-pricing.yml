description: >-
  WoowUp publishes four named plan tiers on its pricing page, each defined by a
  contact-database band and an included monthly email volume, but publishes only
  one price: a "desde USD 700 / mes" floor that applies to the entry tier. Every
  tier's final price is quoted by sales ("Solicitar una cotización
  personalizada"), scaling with database size, send volume, active channels,
  customization level, integrations and advanced features. SMS and WhatsApp
  carry variable per-use costs on top, and initial technical setup is a separate
  variable charge. Pricing is published in Spanish; quotas below are transcribed
  verbatim from the page.
currency: USD
billing_period: monthly
pricing_model: tiered by contact-database size and monthly send volume, sales-quoted
plan_count: 4
