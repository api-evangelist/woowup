currency_note: >-
  IMPORTANT — none of the four packages publishes a single SemVer tag. Packagist
  lists only dev- branch pseudo-versions for every one of them, so `version` is
  null throughout and `published` carries the date of the most recent branch
  publication instead. A consumer running `composer require woowup/...` must
  pin a branch (e.g. dev-master) and cannot express a version constraint; there
  is no release, no changelog and no upgrade path. The two client libraries are
  actively maintained (branches published 2026-08-07), the VTEX connector is
  current (2026-07-21), and the Magento connector has not been touched since
  2023-12-27 — a stale-SDK signal against a platform still documenting Magento
  1 and Magento 2 onboarding.
